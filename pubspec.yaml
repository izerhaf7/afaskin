name: afaskin
description: "Afa Skin: analisis kondisi kulit wajah dari selfie dan rekomendasi skincare berbasis bahan aktif."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  json_annotation: ^4.12.0
  material_ui: ^1.10.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/mock/
    - assets/mock/products/

  fonts:
    # Display font. The real Etna file was not provided yet, so League Spartan
    # Bold (OFL) stands in. To switch: drop the Etna .otf/.ttf into
    # assets/fonts/etna/ and change the asset path below. Nothing else changes.
    - family: Etna
      fonts:
        - asset: assets/fonts/etna/Placeholder-LeagueSpartan-Bold.ttf
    # Body font. Belleza only ships Regular: never request bold.
    - family: Belleza
      fonts:
        - asset: assets/fonts/belleza/Belleza-Regular.ttf
