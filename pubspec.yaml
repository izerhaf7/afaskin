name: afaskin
description: "Afa Skin: analisis kondisi kulit wajah dari selfie dan rekomendasi skincare berbasis bahan aktif."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.7

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_litert: 3.10.0
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_face_mesh_detection: 0.6.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  image: ^4.12.0
  image_picker: ^1.2.4
  json_annotation: ^4.12.0
  material_ui: ^1.10.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/ml/
    - assets/mock/
    - assets/mock/products/
    - assets/fonts/belleza/OFL.txt
    - assets/fonts/etna/OFL-LeagueSpartan.txt

  fonts:
    # Display font. The real Etna file was not provided yet, so League Spartan
    # Bold (OFL) stands in. To switch: drop the Etna .otf/.ttf into
    # assets/fonts/etna/ and change the asset path below. Nothing else changes.
    - family: Etna
      fonts:
        - asset: assets/fonts/etna/Placeholder-LeagueSpartan-Bold.ttf
    # Body font. Belleza only ships Regular: never request bold.
    - family: Belleza
      fonts:
        - asset: assets/fonts/belleza/Belleza-Regular.ttf
