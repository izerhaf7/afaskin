name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Set the repository variable API_BASE_URL (Settings > Secrets and
      # variables > Actions > Variables) to build against the real backend.
      # Without it, the APK runs in mock mode for demos.
      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release \
              --dart-define=USE_MOCK=false \
              --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build apk --release --dart-define=USE_MOCK=true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: afaskin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
