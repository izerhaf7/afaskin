include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # App code, not a published package: doc comments where useful, not on
    # every public member.
    public_member_api_docs: false
    lines_longer_than_80_chars: false
